services:

  # ── PostgreSQL 17 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: olimpiadas_db
      POSTGRES_USER: olimpiadas_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olimpiadas_user -d olimpiadas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - olimpiadas-network

  # ── Backend FastAPI (Gunicorn + Uvicorn + Playwright) ────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://olimpiadas_user:${DB_PASSWORD}@postgres:5432/olimpiadas_db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - UPLOAD_PATH=/app/uploads
      - API_BASE_URL=http://102.76.89.231
      - PLAYWRIGHT_BROWSERS_PATH=/home/app/.cache/ms-playwright
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # E-mail (preencher no .env-production)
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-True}
      - MAIL_SSL_TLS=${MAIL_SSL_TLS:-False}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - olimpiadas-network

  # ── Nginx — Proxy reverso + Frontend React ───────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/olimpiadas/frontend/dist:/usr/share/nginx/html:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - olimpiadas-network

# ── Volumes nomeados (dados persistem entre restarts) ────────────────────────
volumes:
  postgres_data:
  uploads:
  logs:

# ── Rede interna ─────────────────────────────────────────────────────────────
networks:
  olimpiadas-network:
    driver: bridge
